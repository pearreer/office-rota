<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ตารางเข้า Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* Layout: sticky header with tabs → one working view at a time (calendar board, dashboards, guide, history, settings). Batch A = teal, Batch B = apricot, swaps = lavender. */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --surface-2:#F7F9FA; --line:#DCE3E8;
  --ink:#1F2B35; --ink-muted:#55636F; --primary-deep:#173F45;
  --a-soft:#D3ECE8; --a-deep:#1C5A52; --a-bar:#6DB2A8;
  --b-soft:#F8E1CB; --b-deep:#83461A; --b-bar:#E2A46F;
  --s-soft:#E4DEF6; --s-deep:#4A3C82; --s-line:#9D8FD6;
  --hol:#EEF0F2; --hol-ink:#6A5560;
  --me-soft:#DCEBFB; --me-deep:#0B4A94; --me-line:#1F6FD1;
  --warn-soft:#FFF1C7; --warn-deep:#7A4A00; --warn-line:#E0A100; --warn-strong:#B26A00;
  --focus:#2B7A71; --danger:#A23B3B;
  --font-d:"Prompt","Leelawadee UI",Tahoma,sans-serif;
  --font-b:"IBM Plex Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12191E; --surface:#1A232A; --surface-2:#1F2A32; --line:#2E3C46;
  --ink:#E4ECF0; --ink-muted:#9DAEBA; --primary-deep:#A8DDD5;
  --a-soft:#1E3B38; --a-deep:#9FDCD2; --a-bar:#4F978D;
  --b-soft:#3F2E20; --b-deep:#F3C49D; --b-bar:#B97B47;
  --s-soft:#2C2746; --s-deep:#CBC0F2; --s-line:#7D6FC0;
  --hol:#20282E; --hol-ink:#D3B5C2; --me-soft:#16304F; --me-deep:#A9CEF7; --me-line:#4C93E6; --warn-soft:#3A2C08; --warn-deep:#FFD873; --warn-line:#E0A100; --warn-strong:#FFC94A; --focus:#7FCFC3; --danger:#F09A9A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12191E; --surface:#1A232A; --surface-2:#1F2A32; --line:#2E3C46;
  --ink:#E4ECF0; --ink-muted:#9DAEBA; --primary-deep:#A8DDD5;
  --a-soft:#1E3B38; --a-deep:#9FDCD2; --a-bar:#4F978D;
  --b-soft:#3F2E20; --b-deep:#F3C49D; --b-bar:#B97B47;
  --s-soft:#2C2746; --s-deep:#CBC0F2; --s-line:#7D6FC0;
  --hol:#20282E; --hol-ink:#D3B5C2; --me-soft:#16304F; --me-deep:#A9CEF7; --me-line:#4C93E6; --warn-soft:#3A2C08; --warn-deep:#FFD873; --warn-line:#E0A100; --warn-strong:#FFC94A; --focus:#7FCFC3; --danger:#F09A9A; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--font-d);color:var(--primary-deep);text-wrap:balance;margin:0;font-weight:600}
h1{font-size:26px} h2{font-size:21px} h3{font-size:17px}
.en{color:var(--ink-muted);font-weight:400;font-size:.8em;font-family:var(--font-b)}
.muted{color:var(--ink-muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.badge-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--a-soft);color:var(--a-deep);flex:none}
.brand p{margin:0;font-size:13px;color:var(--ink-muted)}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;max-width:100%}
#meSel{max-width:100%;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--ink-muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--a-bar)}
select,input[type=text],input[type=search],input[type=date],input[type=password],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px}
textarea{width:100%;min-height:180px;font-size:14px;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{font:inherit;font-size:14px;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;color:var(--ink-muted);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--primary-deep);border-bottom-color:var(--a-bar);font-weight:600}
.btn{font:inherit;font-size:14px;display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;min-height:38px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary-deep);color:var(--surface);border-color:var(--primary-deep)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:not-allowed}
main{padding-block:20px 120px}
.view{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.view>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h .badge-ic{width:34px;height:34px}
.sec-h .badge-ic svg{width:18px;height:18px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav h2{min-width:190px;text-align:center}
#monthSel{font-family:var(--font-d);font-size:18px;font-weight:600;color:var(--primary-deep);min-width:200px;cursor:pointer}
.iconbtn{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted)}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--line)}
.sw.a{background:var(--a-soft)} .sw.b{background:var(--b-soft)} .sw.s{background:var(--s-soft);border-color:var(--s-line)} .sw.h{background:var(--hol)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cal-sticky{position:sticky;top:calc(var(--hdr,0px) + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);display:grid;gap:8px;padding-block:6px 8px;margin-top:-6px}
.cal-bar{padding:12px 16px;box-shadow:0 2px 8px color-mix(in srgb,var(--ink) 8%,transparent)}
.cal-head{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cal-head .dow{font-size:13px;font-weight:600;color:var(--ink-muted);padding:0 4px}
.fz1,.fz2{position:sticky;background:var(--surface);z-index:1}
.fz1{left:0;min-width:84px;max-width:84px}
.fz2{left:84px;box-shadow:1px 0 0 var(--line)}
th{z-index:2} th.fz1,th.fz2{z-index:3;background:var(--surface-2)}
tfoot td.fz1,tfoot td.fz2{background:var(--surface-2)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-height:120px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:box-shadow .15s}
.day.pad{background:transparent;border:1px dashed var(--line);opacity:.5}
.day.today{box-shadow:0 0 0 2px var(--a-bar)}
.day.drop{box-shadow:0 0 0 2px var(--s-line);background:var(--s-soft)}
.day.target{cursor:copy}
.day.locked .chip{cursor:default}
.day.locked{background:color-mix(in srgb,var(--surface) 70%,var(--bg))}
.cal.ro .day:not(.pad){background:var(--surface-2);border:1px dashed color-mix(in srgb,var(--ink-muted) 45%,var(--line))}
.cal.ro .day:not(.pad) .chip{filter:grayscale(1);opacity:.72;box-shadow:none}
.cal.ro .day:not(.pad) .chip.mine{opacity:.9}
.cal.ro .tag{filter:grayscale(1);opacity:.8}
.cal.ro .dnum,.cal.ro .dnum .dw{color:var(--ink-muted)}
.cal.ro .day.hol{opacity:.75}
.cal-bar.ro{background:var(--surface-2);border-color:color-mix(in srgb,var(--ink-muted) 45%,var(--line));border-style:dashed}
.robar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn-deep);border:2px solid var(--warn-line);border-left-width:6px;font-size:14px;font-weight:500;box-shadow:0 2px 8px color-mix(in srgb,var(--warn-line) 25%,transparent)}
.robar svg.i{color:var(--warn-strong);width:22px;height:22px}
.robar b{font-family:var(--font-d);font-size:15px}
.robar .btn{border-color:var(--warn-line)}
.pill.ro{background:var(--warn-soft);color:var(--warn-deep);border:2px solid var(--warn-line);font-weight:700}
.fwrap{display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%}
.fwrap input{width:100%}
#filter[aria-invalid=true]{border:2px solid var(--danger)}
.ferr{margin:0;font-size:13px;font-weight:600;color:var(--danger);display:flex;align-items:center;gap:4px}
.ferr svg.i{width:14px;height:14px}
.pill.adm{background:var(--me-soft);color:var(--me-deep);border:2px solid var(--me-line);font-weight:700}
.perm-list{margin:0;padding-left:20px;display:grid;gap:6px}
.perm-list b{color:var(--ink)}
.perms{display:flex;flex-wrap:wrap;gap:6px 14px;width:100%}
.perms label{display:inline-flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;min-height:32px}
.perms input{width:18px;height:18px;accent-color:var(--me-line)}
.pill.ro svg.i{color:var(--warn-strong);width:16px;height:16px}
.day-h{display:flex;align-items:center;justify-content:space-between;gap:6px}
.dnum{font-family:var(--font-d);font-size:18px;color:var(--primary-deep)}
.dnum .dw{display:none;font-family:var(--font-b);font-size:15px;color:var(--primary-deep)}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.a{background:var(--a-soft);color:var(--a-deep)} .tag.b{background:var(--b-soft);color:var(--b-deep)}
.day.hol{background:var(--hol);background-image:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--line) 55%,transparent) 8px 9px)}
.holname{font-size:13px;color:var(--hol-ink);font-weight:500}
.chips{display:flex;flex-direction:column;align-items:stretch;gap:4px}
.chip{font:inherit;font-size:13px;line-height:1.3;text-align:left;border-radius:7px;border:1px solid transparent;padding:3px 7px;cursor:pointer;max-width:100%;display:flex;flex-direction:column;min-width:0}
.chip .nm{white-space:normal;overflow-wrap:break-word;min-width:0}
.chip .cd{font-weight:600;margin-right:4px;font-variant-numeric:tabular-nums}
.chip.a{background:var(--a-soft);color:var(--a-deep)} .chip.b{background:var(--b-soft);color:var(--b-deep)}
.chip.sw{background:var(--s-soft);color:var(--s-deep);border-color:var(--s-line)}
.chip .note{font-size:12px;display:flex;align-items:center;gap:3px;opacity:.95}
.chip .note svg{width:12px;height:12px}
.chip .mk svg{width:12px;height:12px;margin-right:3px;vertical-align:-1px}
.chip.mine{background:var(--me-soft);color:var(--me-deep);font-weight:600;border:2px solid var(--me-line);box-shadow:0 2px 6px color-mix(in srgb,var(--me-line) 35%,transparent)}
.chip.mine .nm{display:flex;align-items:center;flex-wrap:wrap;column-gap:2px;white-space:normal}
.chip.mine .nm::after{content:"ฉัน · me";margin-left:auto;padding-left:8px;font-size:12px;font-weight:600;opacity:.9}
.chip.mine.dim{opacity:1}
.chip.sel{outline:3px solid var(--focus);outline-offset:1px;transform:translateY(-1px)}
.chip.dim{opacity:.28}
.chip.leave{background:var(--surface-2);color:var(--ink-muted);border:1px dashed var(--line);cursor:default}
.chip.leave.mine{cursor:pointer;border:2px dashed var(--me-line);background:var(--surface-2)}
.chip.leave .cd,.chip.leave .fn{text-decoration:line-through}
.lv{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:999px;background:var(--danger);color:var(--surface);margin-left:4px;text-decoration:none;vertical-align:1px}
.wfh-lv{font-size:12px;color:var(--ink-muted);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.wfh-lv .chip{font-size:12px}
.count{font-size:12px;color:var(--ink-muted)}
@media (max-width:760px){
  .cal{grid-template-columns:1fr} .cal-head,.day.pad{display:none} .cal-sticky{position:static;margin-top:0}
  .day{min-height:0} .dnum .dw{display:inline} .dnum .dn{display:none}
  .month-nav h2{min-width:0;font-size:19px}
}
/* action bar + modal + toast */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:2px solid var(--s-line);display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:center}
.actionbar p{margin:0;max-width:760px}
.overlay{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,#0b1216 45%,transparent);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;border:1px solid var(--line);max-width:520px;width:100%;padding:22px;display:grid;gap:14px;max-height:90vh;overflow:auto}
.swapviz{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.swapviz .side{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.swapviz .side b{display:block;font-family:var(--font-d);color:var(--primary-deep)}
.swapviz .arrow{color:var(--s-deep)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;top:calc(80px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;background:var(--primary-deep);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
/* dashboards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.kpi .v{font-family:var(--font-d);font-size:28px;color:var(--ink);line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--ink-muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--surface-2);color:var(--primary-deep);font-weight:600;position:sticky;top:0}
td.l,th.l{text-align:left}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;background:var(--surface-2)}
.heat{border-radius:4px}
.sortb{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.sortb:hover{text-decoration:underline}
.sortb .ar{font-size:11px;opacity:.35}
th[aria-sort] .sortb .ar{opacity:1}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-muted);font-family:var(--font-b);font-size:13px}
.chart .val{fill:var(--ink);font-size:12px}
.board{display:grid;grid-template-columns:40px max-content minmax(60px,1fr) 50px;gap:8px 10px}
.rank{display:grid;grid-column:1/-1;grid-template-columns:subgrid;align-items:center}
.rank .no{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--font-d);color:var(--ink-muted)}
.rank .no.top{background:var(--s-soft);color:var(--s-deep)}
.rank .no.r1{background:#FBEFC4;color:#8A6400;box-shadow:inset 0 0 0 2px #E2B93B}
.rank .no.r2{background:#ECEFF3;color:#56606B;box-shadow:inset 0 0 0 2px #A7B0BA}
.rank .no.r3{background:#F6E2D3;color:#8A4B20;box-shadow:inset 0 0 0 2px #C9875A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rank .no.r1{background:#3D3315;color:#F2CF63}:root:not([data-theme="light"]) .rank .no.r2{background:#2C3239;color:#D2D8DF}:root:not([data-theme="light"]) .rank .no.r3{background:#3B2A1E;color:#E7A97C}}
:root[data-theme="dark"] .rank .no.r1{background:#3D3315;color:#F2CF63} :root[data-theme="dark"] .rank .no.r2{background:#2C3239;color:#D2D8DF} :root[data-theme="dark"] .rank .no.r3{background:#3B2A1E;color:#E7A97C}
.rank .bar{height:14px;border-radius:7px;background:var(--s-line)}
.rank .bar.r1{background:#E2B93B} .rank .bar.r2{background:#A7B0BA} .rank .bar.r3{background:#C9875A}
.rank .nm{white-space:nowrap}
@media (max-width:600px){.board{grid-template-columns:36px minmax(0,1fr) 44px}.rank .barw{display:none}.rank .nm{white-space:normal;overflow-wrap:break-word}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:14px;border:0;background:var(--surface);color:var(--ink-muted);padding:7px 12px;cursor:pointer}
.seg button{display:inline-flex;align-items:center;gap:5px}
.seg button svg.i{width:16px;height:16px}
.seg button[aria-pressed=true]{background:var(--a-soft);color:var(--a-deep);font-weight:600}
/* guide */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;counter-reset:s}
.steps>*,.step>*{min-width:0}
.step h3{overflow-wrap:anywhere}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start}
.step .n{width:34px;height:34px;border-radius:50%;background:var(--s-soft);color:var(--s-deep);display:grid;place-items:center;font-family:var(--font-d);font-size:17px}
.mini .chip{max-width:100%} .mini .chip .nm{white-space:normal}
.mini{display:flex;flex-wrap:wrap;gap:4px;min-width:0;padding:8px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--line)}
pre.code{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font-size:13.5px;margin:0;font-family:ui-monospace,Consolas,monospace}
/* history */
.hist{display:grid;gap:8px}
.hrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.hrow.undone{opacity:.55}
.hrow .txt{flex:1;min-width:220px}
.st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-muted)}
.st.ok{background:var(--s-soft);color:var(--s-deep)}
.empty{text-align:center;padding:40px 16px;display:grid;gap:10px;justify-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.grid2>*{min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ok-line{color:var(--a-deep);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const BACKUP_COLS = ['setup', 'changes', 'leaves', 'pins', 'roles'];
function dbStore(db) {

/* ---------- schedule engine ---------- */
function holidayMap(cfg) { const m = {}; (cfg?.holidays || []).forEach(h => m[h.date] = h.name); return m; }
function weekdays() { const out = []; for (let m = 0; m < 12; m++) { const n = new Date(Date.UTC(YEAR, m+1, 0)).getUTCDate(); for (let d = 1; d <= n; d++) { const s = iso(YEAR,m,d), w = dowOf(s); if (w >= 1 && w <= 5) out.push(s); } } return out; }
function generatePattern(holidays) {
  const hol = new Set(holidays.map(h => h.date)); const p = {}; let i = 0;
  weekdays().forEach(d => { if (!hol.has(d)) { p[d] = i % 2 === 0 ? 'A' : 'B'; i++; } });
  return p;
}
function empMap() { const m = {}; (S.cfg?.employees || []).forEach(e => m[e.code] = e); return m; }
function activeChanges() { const ep = S.cfg?.epoch || 0; return S.changes.filter(c => chYear(c) === YEAR && (c.epoch || 0) === ep).sort((a,b) => (a.createdAt < b.createdAt ? -1 : a.createdAt > b.createdAt ? 1 : (a.id < b.id ? -1 : 1))); }
function compute() {
  const cfg = S.cfg; if (!cfg?.pattern) { S.sched = null; return; }
  const hol = holidayMap(cfg), days = {}, applied = new Set();
  const workdays = Object.keys(cfg.pattern).filter(d => !hol[d]).sort();
  workdays.forEach(d => { const mp = new Map(); cfg.employees.forEach(e => { if (e.batch === cfg.pattern[d]) mp.set(e.code, null); }); days[d] = mp; });
  activeChanges().forEach(c => {
    if (c.undone) return;
    const D1 = days[c.d1], D2 = days[c.d2];
    if (c.type === 'swap') {
      if (D1 && D2 && D1.has(c.a) && D2.has(c.b) && !D1.has(c.b) && !D2.has(c.a)) {
        D1.delete(c.a); D2.delete(c.b);
        D1.set(c.b, {type:'swap', for: c.a, id: c.id}); D2.set(c.a, {type:'swap', for: c.b, id: c.id});
        applied.add(c.id);
      }
    } else if (c.type === 'move') {
      if (D1 && D2 && D1.has(c.a) && !D2.has(c.a)) { D1.delete(c.a); D2.set(c.a, {type:'move', from: c.d1, id: c.id}); applied.add(c.id); }
    }
  });
  S.sched = { days, workdays, applied, hol };
  S.lv = new Map(); S.leaves.forEach(l => { if (!l.cancelled && +l.year === YEAR) S.lv.set(l.code + '|' + l.date, l); });
}

// ลาได้เฉพาะวันทำงาน (จ.–ศ. ที่ไม่ใช่วันหยุดนักขัตฤกษ์) ของปีที่เลือก
function leaveBlock(code, d) {

async function commit(type, a, b, d1, d2) {

    await store.addChange({ type, a, b: b || null, d1, d2, by: S.me.id, byCode: S.me.code, createdAt: new Date().toISOString(), undone: false, epoch: S.cfg.epoch || 0, year: YEAR });

function writeFail(e) {

  else if (e?.code === 'unavailable') toast('เชื่อมต่อฐานข้อมูลไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่');

/* ---------- stats ---------- */
function stats() {
  const sc = S.sched, em = empMap(), per = {}, batchM = {A: Array(12).fill(0), B: Array(12).fill(0)}, daysM = {A: Array(12).fill(0), B: Array(12).fill(0)};
  (S.cfg.employees || []).forEach(e => per[e.code] = Array(12).fill(0));
  sc.workdays.forEach(d => {
    const m = +d.slice(5,7) - 1; daysM[S.cfg.pattern[d]][m]++;
    sc.days[d].forEach((_, code) => { if (per[code]) per[code][m]++; const b = em[code]?.batch; if (batchM[b]) batchM[b][m]++; });
  });
  const swaps = {};
  activeChanges().forEach(c => { if (c.undone || !sc.applied.has(c.id)) return; [c.a, c.b].filter(Boolean).forEach(p => swaps[p] = (swaps[p] || 0) + 1); });
  return { per, batchM, daysM, swaps };
}
const sum = a => a.reduce((x,y) => x+y, 0);
function kpi(icon, cls, v, l) { return `<div class="kpi"><div class="badge-ic" style="background:var(--${cls}-soft);color:var(--${cls}-deep)">${ic(icon)}</div><div><div class="v">${v}</div><div class="l">${l}</div></div></div>`; }

  <tbody>${rows}</tbody><tfoot><tr><td class="l">รวมทั้งปี · Year</td><td>${dA+dB}</td><td>${dA}</td><td>${dB}</td><td>${pA}</td><td>${pB}</td></tr></tfoot></table></div>

function groupChart(A, B) {
  const W = 760, H = 280, L = 36, R = 8, T = 22, Bm = 30, max = Math.max(1, ...A, ...B);
  const top = Math.ceil(max / 5) * 5, ih = H - T - Bm, gw = (W - L - R) / 12, bw = Math.min(22, gw * 0.34);
  const y = v => T + ih - (v / top) * ih;
  let g = '';
  for (let t = 0; t <= top; t += 5) g += `<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`;
  A.forEach((a, i) => {
    const cx = L + gw * i + gw / 2, b = B[i];
    g += `<rect x="${cx-bw-1}" y="${y(a)}" width="${bw}" height="${T+ih-y(a)}" rx="3" fill="var(--a-bar)"/><text class="val" x="${cx-bw/2-1}" y="${y(a)-4}" text-anchor="middle">${a}</text>`;
    g += `<rect x="${cx+1}" y="${y(b)}" width="${bw}" height="${T+ih-y(b)}" rx="3" fill="var(--b-bar)"/><text class="val" x="${cx+bw/2+1}" y="${y(b)-4}" text-anchor="middle">${b}</text>`;
    g += `<text x="${cx}" y="${H-8}" text-anchor="middle">${TH_MS[i]}</text>`;
  });
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟแท่งวันเข้า Office ต่อเดือน Batch A และ B" style="min-width:560px">${g}</svg></div>`;
}

function vPerson() {
  if (!S.sched) return needSetup();
  const st = stats(); let em = [...S.cfg.employees];
  const lvCount = {}; S.lv.forEach(l => lvCount[l.code] = (lvCount[l.code] || 0) + 1);
  if (S.personBatch !== 'all') em = em.filter(e => e.batch === S.personBatch);
  // เรียงตามคอลัมน์ที่กดหัวตาราง (กดซ้ำสลับ น้อย→มาก / มาก→น้อย) แล้วตามรหัส
  const {k: sk, dir} = S.psort;
  const val = e => sk === 'code' ? e.code : sk === 'name' ? e.name : sk === 'batch' ? e.batch : sk === 'total' ? sum(st.per[e.code]) : sk === 'swaps' ? (st.swaps[e.code] || 0) : sk === 'leave' ? (lvCount[e.code] || 0) : st.per[e.code][+sk.slice(1)];
  em.sort((a, b) => { const x = val(a), y = val(b); const c = typeof x === 'number' ? x - y : sk === 'name' ? String(x).localeCompare(String(y), 'th') : byCode(x, y); return (c * dir) || byCode(a.code, b.code); });
  const sh = (key, label, cls = '') => { const on = sk === key; return `<th class="${cls}"${on ? ` aria-sort="${dir > 0 ? 'ascending' : 'descending'}"` : ''}><button class="sortb" data-psort="${key}" title="กดเพื่อเรียง · Sort">${label}<span class="ar" aria-hidden="true">${on ? (dir > 0 ? '▲' : '▼') : '▲▼'}</span></button></th>`; };
  const max = Math.max(1, ...em.flatMap(e => st.per[e.code]));
  const cell = (v, b) => `<td><span class="heat num" style="display:inline-block;min-width:30px;padding:1px 4px;background:color-mix(in srgb,var(--${b==='A'?'a':'b'}-soft) ${Math.round(25 + 75*v/max)}%,transparent)">${v}</span></td>`;

  const totals = Array(12).fill(0).map((_, i) => sum(em.map(e => st.per[e.code][i])));
  const yearly = em.map(e => sum(st.per[e.code]));
  return `
  <div class="kpis">
    ${kpi('user','a', em.length, 'จำนวนพนักงานที่แสดง · People')}
    ${kpi('cal','a', yearly.length ? Math.max(...yearly) : 0, 'วันเข้าสูงสุดต่อคน · Max days')}
    ${kpi('cal','b', yearly.length ? Math.min(...yearly) : 0, 'วันเข้าต่ำสุดต่อคน · Min days')}
    ${kpi('swap','s', sum(Object.values(st.swaps)), 'ครั้งที่เกี่ยวข้องกับการแลก/ย้าย · Swap involvements')}
  </div>
  <div class="card"><div class="toolbar" style="margin-bottom:12px"><div class="sec-h" style="margin:0"><div class="badge-ic">${ic('users')}</div><div><h2>วันเข้า Office รายบุคคล <span class="en">Office days by person · month / year</span></h2><p class="small muted" style="margin:0">กดหัวคอลัมน์เพื่อเรียง กดซ้ำเพื่อสลับมาก↔น้อย</p></div></div><div class="spacer"></div>
    <div class="seg" role="group" aria-label="กรอง Batch">${['all','A','B'].map(b => `<button data-pb="${b}" aria-pressed="${S.personBatch===b}">${b==='all'?'ทั้งหมด':'Batch '+b}</button>`).join('')}</div></div>
  <div class="tbl-wrap" style="max-height:70vh"><table><thead><tr>${sh('code', 'รหัส', 'l fz1')}${sh('name', 'ชื่อ', 'l fz2')}${sh('batch', 'Batch', 'l')}${TH_MS.map((m, i) => sh('m' + i, m)).join('')}${sh('total', 'รวมปี')}${sh('swaps', 'แลก/ย้าย')}${sh('leave', 'ลา')}</tr></thead>
  <tbody>${rows || '<tr><td class="l" colspan="18">ไม่มีข้อมูล</td></tr>'}</tbody>
  <tfoot><tr><td class="l fz1">รวม</td><td class="l fz2">Total</td><td></td>${totals.map(t => `<td>${t}</td>`).join('')}<td>${sum(totals)}</td><td></td><td>${sum(em.map(e => lvCount[e.code] || 0))}</td></tr></tfoot></table></div></div>`;

function vHist() {
  if (!S.sched) return needSetup();
  const em = empMap(), me = S.me.code;
  if (!me) return `<div class="card empty">${ic('user')}<h2>เลือก “ฉันคือ” ก่อน <span class="en">Pick yourself first</span></h2><p class="muted" style="margin:0">ประวัติแสดงเฉพาะรายการที่มีชื่อของคุณ</p></div>`;
  const all = can('viewAll'), mineC = c => all || c.a === me || c.b === me;
  const nSw = activeChanges().filter(mineC).length, nLv = S.leaves.filter(l => +l.year === YEAR && (all || l.code === me)).length;
  const seg = `<div class="card" style="padding:12px 16px"><div class="toolbar"><span class="small muted">ดูประวัติ · Show</span><div class="seg" role="group" aria-label="เลือกประวัติ">
    <button data-hv="swap" aria-pressed="${S.histView === 'swap'}">${ic('swap')} แลกกะ / ย้ายวัน <span class="num">(${nSw})</span></button>
    <button data-hv="leave" aria-pressed="${S.histView === 'leave'}">${ic('leave')} ลา <span class="num">(${nLv})</span></button></div></div></div>`;
  if (S.histView === 'leave') return seg + leaveHist(em);
  const list = activeChanges().filter(mineC).reverse();
  const rows = list.map(c => {
    const [ok, why] = canUndo(c); const applied = S.sched.applied.has(c.id);
    const txt = c.type === 'swap'
      ? `<b>${esc(c.a)} ${esc(empName(c.a, em))}</b> ${ic('swap')} <b>${esc(c.b)} ${esc(empName(c.b, em))}</b><br><span class="small">${esc(fmtDay(c.d2))}: ${esc(c.a)} เข้าแทน ${esc(c.b)} · ${esc(fmtDay(c.d1))}: ${esc(c.b)} เข้าแทน ${esc(c.a)}</span>`
      : `<b>${esc(c.a)} ${esc(empName(c.a, em))}</b> ย้ายจาก ${esc(fmtDay(c.d1))} ${ic('arrow')} ${esc(fmtDay(c.d2))}`;
    const status = c.undone ? `<span class="st">ยกเลิกแล้ว</span>` : applied ? `<span class="st ok">มีผล</span>` : `<span class="st">ไม่มีผล (ข้อมูลเปลี่ยน)</span>`;
    return `<div class="hrow ${c.undone?'undone':''}"><div class="txt">${txt}<br><span class="small muted">โดย ${esc(c.byCode)} ${esc(empName(c.byCode, em))} · ${esc(fmtTime(c.createdAt))}</span></div>${status}
      ${(myChange(c) || can('undoAny')) && !c.undone ? `<button class="btn" data-undo="${esc(c.id)}" ${ok?'':'disabled'} title="${esc(why)}">${ic('undo')}ยกเลิก · Undo</button>` : ''}</div>`;
  }).join('');
  return `${seg}<div class="card"><div class="sec-h"><div class="badge-ic">${ic('clock')}</div><div><h2>ประวัติการแลกกะ <span class="en">Change history</span></h2><p class="small muted" style="margin:0">${all ? 'admin: แสดงรายการของทุกคน' : `แสดงเฉพาะรายการที่มีชื่อ ${esc(S.me.code)} ${esc(empName(S.me.code))}`} · ปุ่ม “ยกเลิก” ใช้ได้กับรายการของคุณย้อนหลังได้ ยกเว้นรายการในเดือนที่ผ่านไปแล้ว (ก่อน ${esc(dmy(monthStart()))}) และถ้าคนเดียวกันมีรายการใหม่กว่า ต้องยกเลิกรายการล่าสุดก่อน</p></div></div>
  ${rows ? `<div class="hist">${rows}</div>` : `<div class="empty"><p class="muted">ยังไม่มีการแลกกะที่มีชื่อของคุณ · No changes for you yet</p></div>`}</div>`;
}
function leaveHist(em) {
  const list = S.leaves.filter(l => +l.year === YEAR && (can('viewAll') || l.code === S.me.code)).sort((a, b) => a.date.localeCompare(b.date) || byCode(a.code, b.code));
  const rows = list.map(l => `<div class="hrow ${l.cancelled ? 'undone' : ''}"><div class="txt"><b>${esc(l.code)} ${esc(empName(l.code, em))}</b> ลางาน ${esc(fmtDay(l.date))}<br><span class="small muted">บันทึก ${esc(fmtTime(l.createdAt))}${l.cancelled && l.cancelledAt ? ` · ยกเลิก ${esc(fmtTime(l.cancelledAt))}` : ''}</span></div>${l.cancelled ? '<span class="st">ยกเลิกแล้ว</span>' : '<span class="st ok">ลา</span>'}
    ${!l.cancelled && isLocked(l.date) ? '<span class="st">ล็อก (พ้นเดือนแล้ว)</span>' : ''}${!l.cancelled && canLeaveFor(l.code) && !isLocked(l.date) ? `<button class="btn" data-leave-ask="${esc(l.id)}">${ic('undo')}ยกเลิกการลา</button>` : ''}</div>`).join('');
  return `<div class="card"><div class="sec-h"><div class="badge-ic">${ic('leave')}</div><div><h2>ประวัติการลา <span class="en">Leave · ${YEAR}</span></h2><p class="small muted" style="margin:0">ยกเลิกการลาของตัวเองย้อนหลังได้ ยกเว้นการลาในเดือนที่ผ่านไปแล้ว</p></div><div class="spacer"></div><button class="btn" data-act="leaveMenu" style="white-space:nowrap;flex:none">${ic('leave')}ลางาน</button></div>
  ${rows ? `<div class="hist">${rows}</div>` : `<div class="empty"><p class="muted">ยังไม่มีการลาของคุณ · No leave yet</p></div>`}</div>`;
}

/* ---------- settings / setup ---------- */
function holText(h) { return h.map(x => `${dmy(x.date)} ${x.name}`).join('\n'); }
// อ่านรายชื่อจากไฟล์: หาแถวหัวตารางเอง (รหัส / ชื่อ / นามสกุล / batch) และใช้ batch ตามไฟล์
function findCols(r) {
  const f = re => r.findIndex(x => re.test(x));
  const c = { code: f(/รหัส|code|emp\.?\s*id|^id$|เลขประจำตัว/i), name: f(/^ชื่อ|name|ชื่อ\s*-?\s*(นาม)?สกุล/i), last: f(/^นามสกุล|surname|last\s*name/i), batch: f(/batch|แบทช์|แบตช์|กลุ่ม|ชุด|ทีม|group|^กะ|shift/i) };
  if (c.last === c.name) c.last = -1;
  return c;
}
function normBatch(v) {
  const s = String(v ?? '').toUpperCase().replace(/BATCH|แบทช์|แบตช์|กลุ่ม|ชุด|ทีม|GROUP|SHIFT|กะ|[\s:._\-()]/g, '');
  if (!s) return '';
  if (s === 'A' || s === '1' || s === 'I' || s === 'ก') return 'A';
  if (s === 'B' || s === '2' || s === 'II' || s === 'ข') return 'B';
  return '?' + String(v).trim();
}
function parseRoster(rawRows) {
  const rows = rawRows.map(r => (r || []).map(x => String(x ?? '').trim()));
  let hi = -1, col = { code: 0, name: 1, last: -1, batch: 2 };

      const wb = /\.(csv|txt)$/i.test(file.name) ? XLSX.read(await file.text(), { type: 'string' }) : XLSX.read(await file.arrayBuffer());
      const sheets = wb.SheetNames.map(n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' }));
      rows = sheets.find(r => r.slice(0, 20).some(x => { const c = findCols(x.map(v => String(v).trim())); return c.code >= 0 && c.batch >= 0; })) || sheets[0];
    } else rows = splitLines(await file.text());
    applyImport(parseRoster(rows), file.name);
  } catch { toast('อ่านไฟล์ไม่ได้ ลองบันทึกเป็น .xlsx หรือ .csv'); }
}

// SheetJS รุ่นฟรีไม่เขียน freeze panes จึงแก้ XML ของแต่ละชีตเองก่อนบันทึก
function freezeXlsx(buf, specs) {
  try { return freezeXlsx0(buf, specs); } catch { return new Uint8Array(buf); } // ถ้าแก้ XML ไม่ได้ ให้ดาวน์โหลดไฟล์ปกติ (ไม่ freeze) แทนการล้ม
}
function freezeXlsx0(buf, specs) {
  const z = XLSX.CFB.read(new Uint8Array(buf), { type: 'array' });
  specs.forEach((sp, i) => {
    if (!sp) return;
    const path = z.FullPaths.find(x => x.endsWith(`xl/worksheets/sheet${i + 1}.xml`)); if (!path) return;
    const f = XLSX.CFB.find(z, path);
    const tl = String.fromCharCode(65 + sp.x) + (sp.y + 1);
    const pane = `<pane${sp.x ? ` xSplit="${sp.x}"` : ''}${sp.y ? ` ySplit="${sp.y}"` : ''} topLeftCell="${tl}" activePane="${sp.x && sp.y ? 'bottomRight' : sp.y ? 'bottomLeft' : 'topRight'}" state="frozen"/>`;
    const xml = new TextDecoder().decode(f.content).replace('<sheetView workbookViewId="0"/>', `<sheetView workbookViewId="0">${pane}</sheetView>`);
    f.content = new TextEncoder().encode(xml); f.size = f.content.length;
  });
  return new Uint8Array(XLSX.CFB.write(z, { fileType: 'zip', type: 'array' }));
}

  const fname = `office-schedule-${YEAR}-${pad(m+1)}.xlsx`;

async function saveBlob(fname, blob) {
  if (S.dl) {

document.addEventListener('change', ev => {
  if (ev.target.id === 'holMonth') { S.holMonth = ev.target.value; render(); document.getElementById('holMonth')?.focus(); }
  if (ev.target.dataset?.hf === 'date' && S.draftHol) { const h = S.draftHol[+ev.target.dataset.hi]; if (h) { h.date = ev.target.value; render(); } }
  if (ev.target.id === 'yearSel') { setYear(+ev.target.value); document.getElementById('yearSel')?.focus(); }
  if (ev.target.id === 'monthSel') { S.month = +ev.target.value; render(); document.getElementById('monthSel')?.focus(); }
  if (ev.target.id === 'meSel') { askSwitch(ev.target.value); }
  if (ev.target.dataset?.perm && isOwner()) { const [c, k] = ev.target.dataset.perm.split('|'); if (c === PIN_ADMIN) return; const perms = JSON.parse(JSON.stringify(S.admins?.perms || {})); perms[c] = { ...(perms[c] || {}), [k]: ev.target.checked }; saveAdmins(adminCodes(), perms).then(ok => ok && toast(`${ev.target.checked ? 'ให้' : 'ถอน'}สิทธิ “${PERMS.find(p => p[0] === k)?.[1]}” ของ ${c} แล้ว`)); }
  if (ev.target.id === 'restoreFile' && ev.target.files[0]) { if (isOwner() && S.adminOk) restoreFile(ev.target.files[0]); ev.target.value = ''; }
  if (ev.target.id === 'file' && ev.target.files[0]) { importFile(ev.target.files[0]); ev.target.value = ''; }
  if (ev.target.tagName === 'SELECT' && ev.target.dataset.f === 'batch' && S.rosterDraft) { const r = S.rosterDraft[+ev.target.dataset.ri]; if (r) { r.batch = ev.target.value; r.src = 'manual'; render(); } }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { if (document.getElementById('modal').innerHTML) modal(''); else if (S.sel) { S.sel = null; render(); } } });
// drag & drop
document.addEventListener('dragstart', ev => { const c = ev.target.closest?.('.chip[data-code]'); if (!c) return; if (!guardWrite() || !isMe(c.dataset.code) || onLeave(c.dataset.code, c.dataset.date) || isLocked(c.dataset.date)) { if (isLocked(c.dataset.date)) toast(LOCK_MSG); ev.preventDefault(); return; } S.sel = {code: c.dataset.code, date: c.dataset.date}; ev.dataTransfer.setData('text/plain', c.dataset.code); ev.dataTransfer.effectAllowed = 'move'; renderBar(); });
document.addEventListener('dragover', ev => { const d = ev.target.closest?.('.day[data-day]'); if (d && S.sel) { ev.preventDefault(); document.querySelectorAll('.day.drop').forEach(x => x !== d && x.classList.remove('drop')); d.classList.add('drop'); } });
document.addEventListener('drop', ev => { const d = ev.target.closest?.('.day[data-day]'); if (!d || !S.sel) return; ev.preventDefault(); d.classList.remove('drop'); const c = ev.target.closest('.chip[data-code]'); if (c && c.dataset.date !== S.sel.date) askSwap(S.sel, {code: c.dataset.code, date: c.dataset.date}); else if (d.dataset.day !== S.sel.date) askMove(S.sel, d.dataset.day); });
document.addEventListener('dragend', () => document.querySelectorAll('.day.drop').forEach(x => x.classList.remove('drop')));

/* ---------- boot ---------- */
function start() {
  store.onCfgs(m => { S.cfgs = m || {}; const c = S.cfgs[YEAR]; S.cfg = c ? JSON.parse(JSON.stringify(c)) : null; S.cfgLoaded = true; render(); });
  store.onChanges(list => { S.changes = list; render(); });
  store.onLeaves(list => { S.leaves = list; render(); });
  store.onAdmins(a => { S.admins = a; render(); });
  store.onPins(m => { S.pins = m || {}; if (S.tab === 'set' || S.tab === 'admin') render(); });
}
async function boot() {
  render();
  const cfgOk = FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId;
  if (cfgOk && window.firebase) {
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      const cred = await firebase.auth().signInAnonymously(); // เข้าระบบแบบไม่ระบุตัวตน (ไม่ต้องมีบัญชี)
      const db = firebase.firestore();
      try { db.settings({ ignoreUndefinedProperties: true }); } catch {}
      store = dbStore(db); S.live = true;
      S.me.id = cred.user?.uid || null;
    } catch (e) {
      console.error(e);
      S.offlineWhy = 'เชื่อมฐานข้อมูลไม่ได้ (' + (e?.code || 'error') + ') · local';
      toast('เชื่อมต่อ Firebase ไม่ได้: ' + (e?.code || e?.message || 'error') + ' · ตรวจการตั้งค่าตามคู่มือ');
    }
  } else if (cfgOk) {
    S.offlineWhy = 'โหลด Firebase ไม่ได้ · local';
  } else {
    S.offlineWhy = 'ยังไม่ได้ตั้งค่า Firebase · โหมดทดลองในเครื่อง';
  }
  if (!store) store = localStore();
  if (!S.me.id) { let cid = lsGet('rota.cid'); if (!cid) { cid = 'local-' + Math.random().toString(36).slice(2, 10); lsSet('rota.cid', cid); } S.me.id = cid; }
  start();
}
boot();
})();
</script>
